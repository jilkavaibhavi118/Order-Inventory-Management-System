<aside class="sidebar" aria-label="Main navigation">
  <!-- Brand -->
  <a class="brand" routerLink="/dashboard" aria-label="OrderFlow home">
    <span class="brand-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7L12 2.5Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M3.8 7.2 12 12l8.2-4.8M12 12v9.2" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" opacity=".75"/>
      </svg>
    </span>
    <span class="brand-copy">
      <span class="brand-name">OrderFlow</span>
      <span class="brand-tagline">Inventory &amp; Orders</span>
    </span>
  </a>

  <!-- Navigation -->
  <nav class="navigation-links" aria-label="Main menu">
    <div class="nav-group">
      <span class="nav-group-label">Overview</span>
      <a routerLink="/dashboard" routerLinkActive="active" class="navigation-link" title="Dashboard">
        <i class="pi pi-th-large nav-icon" aria-hidden="true"></i>
        <span class="nav-label">Dashboard</span>
      </a>
    </div>

    <div class="nav-group">
      <span class="nav-group-label">Operations</span>
      <a routerLink="/orders" routerLinkActive="active" class="navigation-link" title="Orders">
        <i class="pi pi-shopping-cart nav-icon" aria-hidden="true"></i>
        <span class="nav-label">Orders</span>
      </a>
      <a routerLink="/inventory" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="navigation-link" title="Inventory">
        <i class="pi pi-warehouse nav-icon" aria-hidden="true"></i>
        <span class="nav-label">Inventory</span>
      </a>
    </div>

    <div class="nav-group">
      <span class="nav-group-label">Catalog</span>
      <a routerLink="/products" routerLinkActive="active" class="navigation-link" title="Products">
        <i class="pi pi-box nav-icon" aria-hidden="true"></i>
        <span class="nav-label">Products</span>
      </a>
      <a routerLink="/suppliers" routerLinkActive="active" class="navigation-link" title="Suppliers">
        <i class="pi pi-truck nav-icon" aria-hidden="true"></i>
        <span class="nav-label">Suppliers</span>
      </a>
      <a routerLink="/warehouses" routerLinkActive="active" class="navigation-link" title="Warehouses">
        <i class="pi pi-building nav-icon" aria-hidden="true"></i>
        <span class="nav-label">Warehouses</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-bottom">
    <button type="button" class="logout-button" title="Sign out" (click)="logout()">
      <i class="pi pi-sign-out nav-icon" aria-hidden="true"></i>
      <span class="nav-label">Sign out</span>
    </button>
  </div>
</aside>
