<div class="workspace-layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  @if (isNavigating()) {
    <div class="top-nav-loader" role="progressbar" aria-label="Loading page">
      <div class="top-nav-loader-bar"></div>
    </div>
  }
  <app-sidebar [collapsed]="sidebarCollapsed()" [mobileOpen]="mobileNavOpen()" />
  @if (mobileNavOpen()) {
    <button type="button" class="mobile-nav-backdrop" aria-label="Close navigation" (click)="closeMobileNav()"></button>
  }
  <div class="workspace-main">
    <app-header [sidebarCollapsed]="sidebarCollapsed()" [mobileNavOpen]="mobileNavOpen()" (sidebarToggle)="toggleSidebar()" />
    <main class="workspace-content" id="main-content">
      <router-outlet />
      @if (routeLoading()) {
        <div class="route-loader" role="status" aria-label="Loading page">
          <span class="route-spinner" aria-hidden="true"></span>
        </div>
      }
    </main>
  </div>
</div>
