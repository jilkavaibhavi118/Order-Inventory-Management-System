<div class="workspace-layout">
  <app-sidebar [collapsed]="sidebarCollapsed()" />
  <div class="workspace-main">
    <app-header (sidebarToggle)="toggleSidebar()" />
    <main class="workspace-content" id="main-content">
      <router-outlet />
      @if (routeLoading()) {
        <div class="route-loader" role="status" aria-label="Loading page">
          <span class="route-spinner" aria-hidden="true"></span>
        </div>
      }
    </main>
  
  </div>
</div>
